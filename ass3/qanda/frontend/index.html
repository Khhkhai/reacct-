<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Qanda</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" media="screen" href="styles/global.css" />
</head>

<body class="d-flex flex-column">
	<header id="app-header" class="d-none">
		<button id="home-title" class="home-btn" aria-label="Go to home page">
			Qanda
		</button>
		<div class="header-actions">
			<button id="create-thread-button" class="btn btn-primary" aria-label="Create a new thread">
				<i class="bi bi-pencil-square" aria-hidden="true"></i>
				<span>New Thread</span>
			</button>
			<button id="profile-avatar-btn" class="avatar-btn" aria-label="Open your profile">
				<img id="profile-avatar" class="avatar-img" src="./default-profile-pic.jpg" alt="Profile picture">
			</button>
			<button id="logout-button" class="btn btn-danger" aria-label="Log out">
				<i class="bi bi-box-arrow-right" aria-hidden="true"></i>
			</button>
		</div>
	</header>
  <main>
		<!-- LOGIN PAGE	-->
		<div class="center-page page" id="login-page">
			<h1 class="title">LOGIN</h1>
			<form id="login-form">
				<div class="mb-3">
					<label for="login-email" class="form-label">Email address</label>
					<input type="email" class="form-control" id="login-email" name="email" autofocus required>
				</div>
				<div class="mb-3">
					<label for="login-password" class="form-label">Password</label>
					<input type="password" class="form-control" id="login-password" name="password" required>
				</div>
				<div class="d-grid mt-5 mx-auto">
					<button type="submit" class="btn btn-primary" id="login-submit" aria-label="Login">Login</button>
				</div>
				<div class="mt-3 text-center">
					Don't have an account?
					<a id="register-link" data-page="register" href="#">Register</a>
				</div>
			</form>
		</div>

		<!-- REGISTER PAGE	-->
		<div class="center-page page" id="register-page">
			<h1 class="title">REGISTER</h1>
			<form id="register-form">
				<div class="mb-3">
					<label for="register-email" class="form-label">Email address</label>
					<input type="email" class="form-control" id="register-email" name="email" autofocus required>
				</div>
				<div class="mb-3">
					<label for="register-name" class="form-label">Name</label>
					<input type="text" class="form-control" id="register-name" name="name" required>
				</div>
				<div class="mb-3">
					<label for="register-password" class="form-label">Password</label>
					<input type="password" class="form-control" id="register-password" name="password" required>
				</div>
				<div class="mb-3">
					<label for="register-confirm-password" class="form-label">Confirm Password</label>
					<input type="password" class="form-control" id="register-confirm-password" name="confirm-password" required>
				</div>
				<div class="d-grid mt-5 mx-auto">
					<button type="submit" class="btn btn-primary" id="register-submit" aria-label="Register">Register</button>
				</div>
				<div class="mt-3 text-center">
					Already have an account?
					<a id="login-link" data-page="login" href="#">Login</a>
				</div>
			</form>
		</div>

		<!-- DASHBOARD -->
		<div id="dashboard-container" class="page">

			<!-- THREAD LIST -->
			<section id="thread-list">
				<div id="thread-loading">
					Loading more threads...
				</div>
				<div id="thread-list-container"></div>

			</section>

			<!-- INDIVIDUAL THREAD PAGE -->
			<section id="individual-thread-page">
				<h2 id="welcome-text">Welcome!</h2>

				<div aria-live="polite" aria-atomic="true" class="position-fixed top-10 end-0 p-3">
					<div id="my-toast" class="toast" role="alert">
							<div class="toast-header">
									<strong class="me-auto">New Comment</strong>
									<small class="text-muted">just now</small>
									<button type="button" class="btn-close" data-bs-dismiss="toast"></button>
							</div>
							<div class="toast-body" id="toast-body">
									You recieve a new comment on <span id="thread-title-noti"></span>
							</div>
					</div>
			</div>

				<button id="back-button" class="btn btn-primary">← Back</button>
				<article id="thread-container">
					<h2 id="thread-title"></h2>

					<!-- Thread Post -->
					<div id="thread-post">
						<button id="thread-profile-icon-btn" class="avatar-btn" aria-label="Open author's profile">
							<img id="thread-profile-icon" class="avatar-img" src="./default-profile-pic.jpg" alt="Profile picture">
						</button>

						<div class="thread-content">
							<div id="thread-header">
								<button id="thread-author" class="name" aria-label="View user profile"></button>
								<div id="thread-button-container">
									<button id="thread-like-toggle" class="btn icon-button" aria-label="Like thread">
										<i class="bi bi-heart"></i>
										<span id="thread-likes"></span>
									</button>
									<button id="thread-watch-toggle" class="btn icon-button" aria-label="Like thread">
										<i class="bi bi-eye"></i>
										<span id="thread-watch-status">Watch</span>
									</button>
									<button id="thread-edit-button" class="btn icon-button" aria-label="Like thread">
										<i class="bi bi-pencil-square"></i>
										<span class="small">Edit</span>
									</button>
									<button id="thread-delete-button" class="btn icon-button" aria-label="Like thread">
										<i class="bi bi-trash"></i>
										<span>Delete</span>
									</button>
								</div>
							</div>	
							<div id="thread-body"></div>
						</div>	
					</div>

					<!-- Comments -->
					<section id="comment-section">
						<div id="comment-list-container"></div>
						<textarea placeholder="Add Comment" id="thread-comment-text" required></textarea>
						<button type="button" class="btn btn-primary btn-sm" id="thread-comment-submit" disabled>Submit</button>	
					</section>
				</article>
			</section>
		</div>

		<!-- User Profile -->
		<div id="profile-container" class="page container-fluid">
			<div class="row g-5">
				<div class="col-12 col-md-4 col-lg-3">
					<div id="profile-info" class="card shadow-sm border-0 text-center p-3">
							<img id="profile-img" class="mx-auto mb-3" src="./default-profile-pic.jpg" alt="Profile picture">

							<h5 id="profile-name" class="mb-1">KHIN HTET HTET KHAING</h5>
							<p id="profile-email" class="text-muted mb-1"></p>
							<span id="profile-admin">admin</span>
							<div id="admin-only" data-user-id="" class="p-3">
								<select name="user-permission" id="user-permission">
									<option value="user">User</option>
									<option value="admin">Admin</option>
								</select>
								<button type="button" class="btn btn-sm btn-primary" id="user-permission-submit">Update</button>
							</div>
							<button class="btn btn-secondary" id="profile-edit-button">edit</button>
					</div>
				</div>
				<div class="col-12 col-md-8 col-lg-9">
						<div id="profile-thread-list" class="d-flex flex-column gap-3">
						</div>
				</div>
			</div>

		<!-- Edit Profile Container -->
		<div class="modal fade" id="profile-edit-container" tabindex="-1" aria-labelledby="editProfileContainer" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-md">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="editProfileContainer">Edit Proile</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<form id="edit-profile-form">
							<div class="mb-3">
								<label for="edit-profile-name" class="form-label">Name</label>
								<input type="input" class="form-control " id="edit-profile-name" autofocus>
							</div>
							<div class="mb-3">
								<label for="edit-profile-email" class="form-label">Email address</label>
								<input type="email" class="form-control" id="edit-profile-email">
							</div>
							<div class="mb-3">
								<label for="edit-profile-password" class="form-label">Password</label>
								<input type="password" class="form-control " id="edit-profile-password">
							</div>
							<div class="mb-3">
								<label for="edit-profile-image" class="form-label">Password</label>
								<input type="file" class="form-control " id="edit-profile-image" accept=".png, .jpg, .jpeg">
							</div>			
							<button type="submit" form="edit-profile-form" class="btn btn-primary" id="edit-profile-submit">edit-profile</button>
						</form>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					</div>
				</div>
			</div>
		</div>

		</div>
		<!-- profile-thread-container-template -->
		<div class="profile-thread-container d-none card shadow-sm border-0" id="profile-thread-container-template">
			<div class="card-body">
				<h5 class="card-title profile-thread-title mb-2"></h5>
				<p class="card-text profile-thread-content text-muted mb-3"></p>
				<div class="d-flex justify-content-between align-items-center small text-muted">
					<div class="d-flex gap-3">
						<div>
							<i class="bi bi-heart-fill liked"></i>
							<span class="profile-thread-likes"></span>
						</div>
						<div>
							<i class="bi bi-chat-dots-fill"></i>
							<span class="profile-thread-comments"></span>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- CREATE THREAD PAGE	-->
		<div class="center-page page" id="thread-page">
			<h1>Create Thread</h1>
			<form id="create-thread-form" class="needs-validation">
				<div class="mb-3">
					<label for="create-thread-title" class="form-label">Title: </label>
					<input type="text" class="form-control" id="create-thread-title" autofocus required>
				</div>

				<div class="mb-3">
					<label for="create-thread-body" class="form-label">Body content: </label>
					<textarea id="create-thread-body" class="form-control" required></textarea>
				</div>

				<div class="mb-3">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="create-thread-private" value="private">
						<label class="form-check-label" for="create-thread-private">
							Make it private
						</label>
					</div>
				</div>
				<div class="col-auto gap-2">
					<button type="submit" class="btn btn-primary" id="create-thread-submit">Create</button>
					<button type="button" class="btn btn-secondary" id="create-thread-cancel">Cancel</button>
				</div>

			</form>
		</div>

		<!-- Edit Thread Page -->
		<div class="center-page page" id="edit-thread-container">
			<form id="edit-thread-form" class="needs-validation">
				<div class="mb-3">
					<label for="edit-thread-title" class="form-label">Title: </label>
					<input type="text" class="form-control" id="edit-thread-title" autofocus required>
				</div>

				<div class="mb-3">
					<label for="edit-thread-body" class="form-label">Body content: </label>
					<textarea id="edit-thread-body" class="form-control" required></textarea>
				</div>

				<div class="mb-3">
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="edit-thread-private" value="private">
						<label class="form-check-label" for="edit-thread-private">
							Make it private
						</label>
					</div>
					<div class="form-check">
						<input class="form-check-input" type="checkbox" id="edit-thread-locked" value="locked">
						<label class="form-check-label" for="edit-thread-locked">
							locked?
						</label>
					</div>
				</div>

				<div class="col-auto">
					<button type="submit" class="btn btn-primary" id="edit-thread-submit">Confirm</button>
					<button type="button" class="btn btn-secondary" id="edit-thread-cancel">Cancel</button>
				</div>
			</form>
		</div>

		<!-- list-thread-container-template -->
		<template id="list-thread-template">
			<div class="list-group-item list-thread-container" data-thread-id="">
				<div class="list-thread-title nowrap"></div>
				<div class="list-thread-author nowrap"></div>
				<div class="thread-meta">
					<span class="list-thread-date"></span>
					<div class="right">
						<span class="list-thread-type"></span>
						<div class="thread-likes-box">
								<i class="bi bi-heart-fill liked"></i>
								<span class="list-thread-likes"></span>
						</div>
					</div>
				</div>
			</div>
		</template>
		
		<!-- list-comment-container-template -->
		<template id="list-comment-template">
			<div class="list-group-item list-comment-container">
				<div class="column" id="comment-profile">
					<button class="comment-profile-icon-btn avatar-btn" aria-label="View user profile" data-user-id="">
						<img class="comment-profile-icon avatar-img" src="./default-profile-pic.jpg" alt="Profile picture">
					</button>
					<div class="line"></div>
				</div>
				<div class="column contents"> 
					<div class="comment-header">
						<button class="list-comment-author name" data-user-id="" aria-label="View user profile"></button>
						<span class="list-comment-date"></span>
					</div>

					<div class="list-comment-body"></div>
					<div class="list-button-container">
						<button class="btn icon-button comment-like-button" data-comment-id="" aria-label="Like comment">
							<i class="bi bi-heart"></i>
							<span class="list-comment-likes"></span>
						</button>
						<button class="btn comment-reply-button icon-button" data-comment-id="" aria-label="Reply to comment">
							<i class="bi bi-reply"></i>
							<span>Reply</span>
						</button>
						<button class="btn icon-button comment-edit-button" data-comment-id="" aria-label="Edit comment">
							<i class="bi bi-pencil-square"></i>
							<span>Edit</span>
						</button>
					</div>
					<div class="list-comment-reply"></div>
				</div>
			</div>
		</template>

		<!-- Reply Container -->
		<div class="modal fade" id="comment-reply-container" tabindex="-1" aria-labelledby="replyContainer" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-md">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Reply Comment</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body body-textarea">
						<label for="comment-reply-text" class="col-form-label">Comment:</label>
						<textarea id="comment-reply-text" required></textarea>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
						<button type="button" class="btn btn-primary" id="comment-reply-submit" disabled>Submit</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Edit Comment Container -->
		<div class="modal fade" id="comment-edit-container" tabindex="-1" aria-labelledby="editReplyContainer" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-md">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Edit Comment</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body body-textarea">
						<label for="comment-edit-text" class="col-form-label">Comment:</label>
						<textarea id="comment-edit-text"></textarea>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
						<button type="button" class="btn btn-primary" id="comment-edit-submit" disabled>Submit</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Error container	-->
		<div class="modal fade" id="error-container" tabindex="-1" aria-labelledby="errorPopup" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered modal-md">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Error</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<p id="alert-message"></p>
					</div>
					<div class="modal-footer">
						<button class="btn btn-primary" data-bs-dismiss="modal" id="error-close" autofocus>Close</button>
					</div>
				</div>
			</div>
		</div>
	</main>
	<script type="module" src="src/main.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
