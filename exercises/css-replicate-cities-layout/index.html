<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            text-align: center;
            padding: 10px 0;
        }
        .image-holder {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        .city img{
            width: 400px;
            height: 250px;
        }
        .city p {
            text-align: center;
            font-size: 20px;
            padding: 1px 0;
            margin: 0;;
        }
    </style>
</head>
<body>
    <h1>Australian Cities</h1>
    <div class="image-holder">
        <div class="city">
            <img alt="Sydney" src="https://www.telegraph.co.uk/content/dam/Travel/Destinations/Oceania/Australia/Sydney/sydney-guide-lead-sunset.jpg" />
            <p>Sydney</p>
        </div>
        <div class="city">
            <img alt="Melbourne" src="https://www.rmit.edu.au/content/dam/rmit/au/en/news/news_Melbourne_AdobeStock.jpg" />
            <p>Melbourne</p>
        </div>
        <div class="city">
            <img alt="Adelaide" src="https://d31atr86jnqrq2.cloudfront.net/images/aerial-city-adelaide.jpg" />
            <p>Adelaide</p>
        </div>
    </div>
</body>
</html>
